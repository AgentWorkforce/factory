# Every user-facing feature in @agent-relay/factory, categorized and scored.
#
# criticality:
#   critical - product cannot function without this; verify on every change
#   hot      - commonly used or safety-sensitive path; verify for related changes
#   standard - useful supporting or programmatic feature; verify periodically
#
# verify_tier (what is required to run verification):
#   1 - nothing beyond the installed package/source checkout
#   2 - a valid factory.config.json (fixture-backed is acceptable)
#   3 - reachable ticket provider credentials (Linear or GitHub)
#   4 - a fleet backend (internal broker or hosted Relay fleet) is available
#   5 - cloud auth and a writable Relayfile mount are available
#   6 - manual verification with a live issue or pull request
#
# Tier alone is not a test plan. Every category is mapped to a named procedure
# with exact prerequisites, setup, assertions, cleanup, and automation limits.
# Procedures live in .agentworkforce/features/verify/procedures.md.

verification:
  document: .agentworkforce/features/verify/procedures.md
  categories:
    cli-operations: cli-and-package
    fleet-cli: fleet-execution
    discovery-events: provider-discovery
    triage-routing: triage-and-configuration
    dispatch-orchestration: issue-dispatch-lifecycle
    human-loop: human-clarification
    pr-lifecycle: pull-request-lifecycle
    safety: safety-boundaries
    mount-writeback: integrations-and-writeback
    fleet-node: fleet-execution
    webhook-subscriptions: event-intake
    programmatic-api: public-api
    hosted-control-plane: hosted-control-plane
    cloud-observability: cloud-observability
    release-verification: release-verification
    verification-environments: verification-environments
    proactive-health: proactive-health
    config-intake: triage-and-configuration
    config-repositories: triage-and-configuration
    config-loop: loop-and-recovery
    config-models-and-human: human-clarification
    config-linear-states: provider-discovery
    config-safety: safety-boundaries
    config-node-and-loading: fleet-execution

categories:
  cli-operations:
    name: Factory CLI Operations
    description: Published factory commands and global execution controls
    criticality: critical
    features:
      - id: cli-help
        name: CLI Help
        cli: factory --help
        description: Print the complete factory command and global option surface without loading config
        location: src/cli/fleet.ts
        verify_tier: 1

      - id: cli-version
        name: CLI Version
        cli: factory --version
        description: Print the installed @agent-relay/factory package version without loading configuration or constructing provider and fleet clients
        location: src/cli/fleet.ts, package.json
        verify_tier: 1

      - id: cli-featuremap-check
        name: Repository Feature-Map Check
        cli: factory featuremap check [--manifest <path>] [--base <ref>]
        api: checkFeatureMap()
        description: Fail CI on malformed feature manifests, duplicate ids, invalid tiers, catalog drift, or missing locations and advise reviewers when referenced code changes beside unchanged metadata
        location: src/featuremap/validate.ts, src/featuremap/check.ts, src/cli/fleet.ts
        verify_tier: 1

      - id: cli-run-once
        name: Single Factory Cycle
        cli: factory run-once
        api: Factory.runOnce()
        description: Run one discover, triage, and dispatch cycle and emit an IterationReport as JSON
        location: src/cli/fleet.ts, src/orchestrator/factory.ts
        verify_tier: 2

      - id: cli-start-live
        name: Live Factory Daemon
        cli: factory start --mode live
        api: "Factory.start({ mode: 'live' })"
        description: Start the long-lived event-driven factory daemon until SIGINT or SIGTERM
        location: src/cli/fleet.ts, src/orchestrator/factory.ts
        verify_tier: 4

      - id: cli-status
        name: Factory Status
        cli: factory status
        api: Factory.status()
        description: Print in-flight issues, queued issues, counters, and Slack degradation state as JSON
        location: src/cli/fleet.ts, src/orchestrator/factory.ts
        verify_tier: 2

      - id: cli-loop
        name: Bounded Factory Loop
        cli: factory loop
        api: Factory.runLoop()
        description: Run a bounded multi-iteration factory loop with heartbeat and circuit-breaker handling
        location: src/cli/fleet.ts, src/orchestrator/factory.ts
        verify_tier: 2

      - id: cli-loop-status
        name: Loop Liveness Status
        cli: factory loop-status
        api: checkFactoryLoopLiveness()
        description: Read the loop heartbeat and report whether the owning process is live or stale
        location: src/cli/fleet.ts, src/orchestrator/factory.ts
        verify_tier: 2

      - id: cli-kill-loop
        name: Stop Loop by Heartbeat PID
        cli: factory kill-loop
        description: Send SIGTERM to the process recorded in the configured factory heartbeat
        location: src/cli/fleet.ts
        verify_tier: 6

      - id: cli-reap-orphans
        name: Reap Orphaned Factory Agents
        cli: factory reap-orphans
        api: reapFactoryOrphansOnce()
        description: Reconcile stale heartbeat and registry state and terminate factory-owned orphan processes
        location: src/cli/fleet.ts, src/orchestrator/reaper.ts
        verify_tier: 4

      - id: cli-canary
        name: Sync-Fidelity Canary
        cli: factory canary <KEY|path>
        description: Exercise the real dry-run discovery and triage path and fail if a known issue is not dispatch-ready
        location: src/cli/fleet.ts
        verify_tier: 3

      - id: cli-triage
        name: Triage One Issue
        cli: factory triage <KEY|path>
        api: Factory.triageIssue()
        description: Read one Linear or GitHub issue, route it, and print the normalized triage decision
        location: src/cli/fleet.ts, src/orchestrator/factory.ts
        verify_tier: 3

      - id: cli-dispatch
        name: Dispatch One Issue
        cli: factory dispatch <KEY|path>
        api: Factory.dispatch()
        description: Triage one issue and dispatch its implementation team through the selected fleet backend
        location: src/cli/fleet.ts, src/orchestrator/factory.ts
        verify_tier: 4

      - id: cli-github-numeric-issue
        name: GitHub Numeric Issue Resolution
        cli: factory <canary|triage|dispatch> <issue-number>
        description: Resolve a positive GitHub issue number within configured repositories without requiring a repo-qualified path
        location: src/cli/fleet.ts
        verify_tier: 3

      - id: cli-babysit
        name: Standalone Pull Request Babysitter
        cli: factory babysit <PR-number|GitHub-PR-URL>
        description: Spawn a one-shot task-exit babysitter for an existing open non-draft same-repository PR with manifest-derived verification guidance scoped to its changed files
        location: src/cli/fleet.ts, src/github/standalone-babysitter.ts
        verify_tier: 6

      - id: cli-close-probe
        name: Close Synthetic Probe PR
        cli: factory close-probe <PR> --repo <owner/repo> --issue <KEY>
        api: closeProbePr()
        description: Guard and close a synthetic probe pull request through the connected GitHub write path
        location: src/cli/fleet.ts, src/github/probe-closer.ts
        verify_tier: 6

      - id: cli-config-option
        name: Alternate Config File
        cli: factory <command> --config <path>
        description: Load factory configuration from a caller-selected JSON path instead of ./factory.config.json
        location: src/cli/fleet.ts
        verify_tier: 1

      - id: cli-dry-run-option
        name: Dry-Run Execution
        cli: factory <run-once|loop|dispatch|babysit> --dry-run
        description: Discover and triage without provider writes, agent spawns, or destructive lifecycle changes
        location: src/cli/fleet.ts, src/orchestrator/factory.ts
        verify_tier: 2

      - id: cli-backend-option
        name: Fleet Backend Selection
        cli: factory <command> --backend <internal|relay>
        api: 'createFleet({ backend })'
        description: Select an internal relay broker or the hosted Relay fleet for agent placement
        location: src/cli/fleet.ts, src/fleet/create-fleet.ts
        verify_tier: 4

      - id: cli-agent-exit-timeout-option
        name: Owned Broker Agent Exit Timeout
        cli: factory <command> --agent-exit-timeout <ms>
        api: FACTORY_AGENT_EXIT_TIMEOUT_MS
        description: Bound how long a factory-owned internal broker waits for task-exit agents during disposal
        location: src/cli/fleet.ts, src/fleet/create-fleet.ts, src/fleet/internal-fleet-client.ts
        verify_tier: 4

