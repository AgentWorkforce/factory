name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # PR checkouts otherwise use GitHub's synthetic merge commit, while
          # the attestation is required to bind the exact reviewed head SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate feature map
        run: npm run featuremap:check

      - name: Test
        run: npm test

      - name: Verify packed end-to-end lifecycle
        run: npm run verify:e2e
        env:
          FACTORY_E2E_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FACTORY_E2E_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Upload head-bound E2E attestation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: factory-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/factory-e2e-attestation.json
          if-no-files-found: error

      - name: Verify package contents
        run: npm pack --dry-run

  kubernetes-provider-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install kind
        run: |
          curl --fail --location --output kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          echo 'eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa  kind' | sha256sum --check
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Install Helm
        run: |
          curl --fail --location --output helm.tar.gz https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz
          echo 'f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1  helm.tar.gz' | sha256sum --check
          tar --extract --gzip --file helm.tar.gz linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm

      - name: Verify Kubernetes provider against a stand-in customer cluster
        run: npm run test:e2e:kubernetes

      - name: Upload Kubernetes provider load evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: factory-kubernetes-provider-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/kubernetes-provider-e2e/load.json
          if-no-files-found: error

  load-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Keep the load evidence bound to the reviewed head, matching the
          # package job's head-bound attestation.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install kind
        run: |
          curl --fail --location --output kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          echo 'eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa  kind' | sha256sum --check
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Run in-cluster load harness E2E
        run: |
          trap 'kind delete cluster --name factory-load-e2e' EXIT
          kind create cluster --name factory-load-e2e --image kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
          npm run test:e2e:load

      - name: Upload load evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: factory-load-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/load-e2e/*.json
          if-no-files-found: error

  verification-gate-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The verification verdict and uploaded evidence must cover the exact
          # reviewed head, never GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install kind
        run: |
          curl --fail --location --output kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          echo 'eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa  kind' | sha256sum --check
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Run verification merge gate E2E
        run: |
          trap 'kind delete cluster --name factory-gate-e2e' EXIT
          kind create cluster --name factory-gate-e2e --image kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f --config test/fixtures/kubernetes/kind-config.yaml
          bash scripts/install-calico.sh
          npm run test:e2e:verification

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: factory-verification-gate-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/verification-gate-e2e/*.json
          if-no-files-found: error

  verification-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install kind
        run: |
          curl --fail --location --output kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          echo 'eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa  kind' | sha256sum --check
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Install Helm
        run: |
          curl --fail --location --output helm.tar.gz https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz
          echo 'f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1  helm.tar.gz' | sha256sum --check
          tar --extract --gzip --file helm.tar.gz linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm

      - name: Deploy and verify descriptor stack
        run: |
          trap 'kind delete cluster --name factory-stack-e2e' EXIT
          kind create cluster --name factory-stack-e2e --image kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f --config test/fixtures/kubernetes/kind-config.yaml
          bash scripts/install-calico.sh
          npm run test:stack-e2e
