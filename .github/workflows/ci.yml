name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # PR checkouts otherwise use GitHub's synthetic merge commit, while
          # the attestation is required to bind the exact reviewed head SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate feature map
        run: npm run featuremap:check

      - name: Test
        run: npm test

      - name: Verify packed end-to-end lifecycle
        run: npm run verify:e2e
        env:
          FACTORY_E2E_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FACTORY_E2E_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Upload head-bound E2E attestation
        uses: actions/upload-artifact@v6
        with:
          name: factory-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/factory-e2e-attestation.json
          if-no-files-found: error

      - name: Verify package contents
        run: npm pack --dry-run

  verification-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: factory-stack-e2e

      - name: Deploy and verify descriptor stack
        run: npm run test:stack-e2e
